name: Build Windows Mod

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      Platform: "x64"
      PreferredToolArchitecture: "x64"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: TBuild/${{ github.event.repository.name }}

      - name: Submodules
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME
          git submodule update --init --depth=1

      - name: Setup environment
        shell: bash
        run: |
          sed -i 's/-T v143/-T v143,host=x64/g' $TBUILD/$REPO_NAME/cmake/run_cmake.py
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Expand Pagefile
        shell: pwsh
        run: |
          try {
            $ComputerSystem = Get-CimInstance Win32_ComputerSystem
            $ComputerSystem.AutomaticManagedPagefile = $False
            Set-CimInstance -CimInstance $ComputerSystem
            $PageFile = Get-CimInstance Win32_PageFileSetting | Where-Object { $_.Name -like 'C:*' }
            if ($PageFile) {
              $PageFile.InitialSize = 16384
              $PageFile.MaximumSize = 32768
              Set-CimInstance -CimInstance $PageFile
            } else {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{ Name = "C:\pagefile.sys"; InitialSize = 16384; MaximumSize = 32768 }
            }
          } catch {
            Write-Host "Pagefile expansion warning: $_"
          }

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2rel-

      - name: Qt cache
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qtrel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qtrel-

      - name: Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Generate stub DesktopPrivate
        shell: bash
        run: |
          mkdir -p $TBUILD/DesktopPrivate
          printf 'const char *PrivateKey = "";\nconst char *PrivateBetaKey = "";\n' > $TBUILD/DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "";\n' > $TBUILD/DesktopPrivate/alpha_private.h

      - name: Configure and build Telegram
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_SPECIAL_TARGET=win64 ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --target Telegram --parallel 2 -- /m:2 /p:PreferredToolArchitecture=x64 /p:TrackFileAccess=false

      - name: Package portable build
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME/out/Release
          mkdir -p portable/Telegram/TelegramForcePortable
          touch portable/Telegram/TelegramForcePortable/.keep
          cp Telegram.exe portable/Telegram/
          cd portable
          7z a -mx9 ../AyuGram-Mod-Win64.zip Telegram/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Mod-Win64
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Release\AyuGram-Mod-Win64.zip
          retention-days: 14
